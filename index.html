<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0c0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="스캔라인">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>스캔라인</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#0c0d10; --surface:#171a20; --surface2:#21252d; --line:#2e3340;
    --amber:#ffb92b; --amber-ink:#22170a; --text:#f0f1f4; --dim:#8b92a3; --danger:#ff6b5e;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:'Manrope',system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;overflow:hidden;overscroll-behavior:none;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button,select,input{font-family:inherit;}

  .screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);}
  .screen.active{display:flex;}

  /* ===== common ===== */
  .topbar{padding:calc(var(--sat) + 10px) 14px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;
    border-bottom:1px solid var(--line);background:var(--bg);min-height:56px;}
  .topbar .title{font-weight:800;font-size:16px;letter-spacing:-.01em;}
  .iconBtn{appearance:none;background:transparent;border:none;color:var(--text);font-size:14px;font-weight:700;
    padding:8px 6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-width:64px;}
  .iconBtn.right{justify-content:flex-end;}
  .btn{appearance:none;border:none;border-radius:12px;padding:14px 18px;font-size:15px;font-weight:800;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-.01em;transition:transform .1s;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--amber);color:var(--amber-ink);}
  .btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line);}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid #4a2b28;}
  .btn.block{width:100%;}
  .btn.sm{padding:11px 14px;font-size:13.5px;}
  .btn[disabled]{opacity:.4;pointer-events:none;}
  .secLabel{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;}

  /* ===== library (landing) ===== */
  .libTop{padding:calc(var(--sat) + 14px) 16px 12px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--line);}
  .brand{font-weight:800;font-size:21px;letter-spacing:-.03em;}
  .brand b{color:var(--amber);font-weight:800;}
  .sortWrap{position:relative;}
  .sortWrap select{appearance:none;-webkit-appearance:none;background:var(--surface2);color:var(--text);border:1px solid var(--line);
    border-radius:999px;padding:9px 32px 9px 14px;font-size:13px;font-weight:700;cursor:pointer;outline:none;}
  .sortWrap::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;border-right:2px solid var(--dim);
    border-bottom:2px solid var(--dim);transform:translateY(-70%) rotate(45deg);pointer-events:none;}
  .sortWrap select:focus-visible{border-color:var(--amber);}
  #libScroll{flex:1;overflow-y:auto;padding:16px 16px calc(130px + var(--sab));}
  #libMeta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);letter-spacing:.06em;margin:0 2px 12px;}
  #libGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
  .dcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;
    transition:transform .12s,border-color .12s;}
  .dcard:active{transform:scale(.98);}
  .dcard:hover{border-color:#464d60;}
  .dcard .th{position:relative;aspect-ratio:3/4;background:#fff;}
  .dcard .th img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;}
  .dcard .pg{position:absolute;right:7px;bottom:7px;background:rgba(12,13,16,.78);color:#fff;font-family:'IBM Plex Mono',monospace;
    font-size:11px;padding:3px 8px;border-radius:6px;}
  .dcard .info{padding:10px 12px 12px;}
  .dcard .nm{font-weight:700;font-size:13.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dcard .mt{margin-top:4px;font-size:11.5px;color:var(--dim);line-height:1.5;}
  .empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:84px 24px 0;gap:14px;}
  .empty svg{width:64px;height:64px;}
  .empty h2{margin:0;font-size:17px;font-weight:800;}
  .empty p{margin:0;color:var(--dim);font-size:13.5px;line-height:1.65;max-width:280px;}
  .fabWrap{position:fixed;left:0;right:0;bottom:0;padding:34px 16px calc(18px + var(--sab));display:flex;gap:10px;justify-content:center;
    background:linear-gradient(180deg,transparent,var(--bg) 42%);pointer-events:none;}
  .fabWrap>*{pointer-events:auto;}
  .fab{appearance:none;border:none;background:var(--amber);color:var(--amber-ink);font-weight:800;font-size:16px;
    padding:16px 30px;border-radius:999px;display:inline-flex;align-items:center;gap:10px;cursor:pointer;
    box-shadow:0 8px 28px rgba(255,185,43,.28);transition:transform .1s;}
  .fab:active{transform:scale(.96);}
  .fabSm{appearance:none;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-weight:700;font-size:14px;
    padding:0 20px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;}

  /* ===== camera ===== */
  #screen-cam{background:#000;}
  #camStage{flex:1;position:relative;overflow:hidden;background:#000;}
  #video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;}
  .camTop{position:absolute;top:0;left:0;right:0;padding:calc(var(--sat) + 12px) 14px 12px;
    display:flex;justify-content:space-between;align-items:center;
    background:linear-gradient(180deg,rgba(0,0,0,.55),transparent);z-index:3;}
  .chip{appearance:none;border:1px solid rgba(255,255,255,.22);background:rgba(20,22,28,.55);
    color:#fff;border-radius:999px;padding:9px 15px;font-size:13px;font-weight:700;
    display:inline-flex;align-items:center;gap:7px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;}
  .chip.on{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);}
  .chip.accent{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);}
  .camTopGroup{display:flex;gap:8px;}
  #hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:3;
    background:rgba(15,17,22,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.14);color:#fff;font-size:13px;font-weight:600;
    padding:9px 16px;border-radius:999px;white-space:nowrap;}
  .camBottom{height:calc(116px + var(--sab));padding:0 22px var(--sab);background:#000;
    display:flex;align-items:center;justify-content:space-between;}
  .sideBtn{width:60px;height:60px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);
    color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;padding:0;}
  .sideBtn.ph{visibility:hidden;}
  .sideBtn img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
  .sideBtn .badge{position:absolute;right:3px;top:3px;background:var(--amber);color:var(--amber-ink);
    font-family:'IBM Plex Mono';font-weight:600;font-size:11px;min-width:20px;height:20px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;padding:0 5px;z-index:2;}
  .shutter{width:78px;height:78px;border-radius:50%;border:4px solid #fff;background:transparent;padding:5px;cursor:pointer;}
  .shutter i{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .1s;}
  .shutter:active i{transform:scale(.88);}
  #flashFx{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5;}
  #flashFx.go{animation:fl .28s ease-out;}
  @keyframes fl{0%{opacity:.85}100%{opacity:0}}
  #camFallback{position:absolute;inset:0;z-index:4;background:var(--bg);display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center;}
  #camFallback.show{display:flex;}
  #camFallback h2{margin:0;font-size:18px;}
  #camFallback p{margin:0;color:var(--dim);font-size:13.5px;line-height:1.6;max-width:320px;}

  /* ===== result ===== */
  #resWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px;position:relative;
    background:radial-gradient(circle at 50% 40%,#1a1d24,#0c0d10);}
  #resCanvas{max-width:100%;max-height:100%;box-shadow:0 8px 40px rgba(0,0,0,.6);background:#fff;}
  #busy{position:absolute;inset:0;background:rgba(12,13,16,.7);display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:12px;z-index:4;font-weight:700;font-size:14px;}
  #busy.show{display:flex;}
  .spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--amber);border-radius:50%;animation:sp .7s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .filtersRow{display:flex;gap:12px;overflow-x:auto;padding:12px 14px 6px;background:var(--bg);border-top:1px solid var(--line);}
  .fopt{flex:0 0 auto;width:70px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;opacity:.55;}
  .fopt.active{opacity:1;}
  .fopt canvas{width:100%;height:60px;object-fit:cover;border-radius:8px;border:2px solid transparent;background:#fff;}
  .fopt.active canvas{border-color:var(--amber);}
  .fopt span{font-size:11px;font-weight:700;}
  .toolsRow{display:flex;justify-content:space-around;padding:6px 10px 4px;background:var(--bg);}
  .tool{appearance:none;background:none;border:none;color:var(--text);font-size:12px;font-weight:700;display:flex;
    flex-direction:column;align-items:center;gap:5px;padding:8px 14px;cursor:pointer;}
  .tool svg{width:22px;height:22px;}
  .bottomActs{display:flex;gap:10px;padding:8px 14px calc(14px + var(--sab));background:var(--bg);}
  .bottomActs .btn{flex:1;}

  /* ===== crop ===== */
  #cropWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px;background:#000;touch-action:none;}
  #cropStage{position:relative;max-width:100%;max-height:100%;line-height:0;touch-action:none;}
  #cropStage canvas{max-width:100%;max-height:calc(100vh - 220px);display:block;}
  #cropSvg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
  .quadFill{fill:rgba(255,185,43,.16);stroke:var(--amber);stroke-width:3;vector-effect:non-scaling-stroke;}
  .hv{fill:var(--amber);stroke:#22170a;stroke-width:3;vector-effect:non-scaling-stroke;}
  .hit{fill:transparent;cursor:grab;}

  /* ===== document detail ===== */
  .nameInput{flex:1;min-width:0;background:transparent;border:1px solid transparent;border-radius:8px;color:var(--text);
    font-size:16px;font-weight:800;text-align:center;padding:7px 8px;outline:none;letter-spacing:-.01em;}
  .nameInput:focus{border-color:var(--amber);background:var(--surface);}
  #docMeta{padding:10px 16px 0;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);letter-spacing:.05em;}
  #pagesGrid{flex:1;overflow-y:auto;padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;align-content:start;}
  .pcard{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);}
  .pcard img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#fff;display:block;cursor:zoom-in;}
  .pcard .n{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.65);font-family:'IBM Plex Mono';font-size:11px;padding:2px 7px;border-radius:5px;}
  .pcard .x{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.7);
    color:var(--danger);border:none;font-size:15px;cursor:pointer;line-height:1;}
  .pcard .mv{display:flex;border-top:1px solid var(--line);}
  .pcard .mv button{flex:1;background:var(--surface2);border:none;color:var(--text);padding:9px 0;font-size:13px;cursor:pointer;}
  .pcard .mv button+button{border-left:1px solid var(--line);}
  .exportBar{padding:12px 14px calc(14px + var(--sab));background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;}
  .exportBtns{display:flex;gap:8px;}
  .exportBtns .btn{flex:1;}
  .rowBtns{display:flex;gap:8px;}
  .rowBtns .btn{flex:1;}



  /* ===== install card ===== */
  #installCard{display:none;margin:0 0 16px;padding:14px;border:1px solid #5b4514;background:linear-gradient(135deg,#231b0a,#171a20);border-radius:14px;gap:12px;flex-direction:column;}
  #installCard.show{display:flex;}
  .icTop{display:flex;align-items:center;gap:12px;}
  .icTop img{width:46px;height:46px;border-radius:11px;flex:0 0 auto;}
  .icTxt{flex:1;min-width:0;}
  .icTxt b{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.01em;}
  .icTxt span{display:block;margin-top:3px;font-size:12px;color:var(--dim);line-height:1.5;}
  #icBtn{appearance:none;border:none;background:var(--amber);color:var(--amber-ink);font-weight:800;font-size:13.5px;padding:11px 16px;border-radius:10px;cursor:pointer;flex:0 0 auto;}
  #icSteps{display:none;font-size:12.5px;line-height:1.75;color:var(--text);background:rgba(255,255,255,.04);border-radius:10px;padding:10px 12px;}
  #icSteps.show{display:block;}

  /* ===== export sheet ===== */
  #exportSheet{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;}
  #exportSheet.show{display:flex;}
  .shBox{width:100%;max-width:560px;max-height:92vh;background:var(--surface);border-radius:20px 20px 0 0;border:1px solid var(--line);
    display:flex;flex-direction:column;padding:16px 16px calc(16px + var(--sab));gap:12px;}
  .shHead{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .shHead b{font-size:17px;font-weight:800;letter-spacing:-.01em;}
  .shX{appearance:none;background:var(--surface2);border:1px solid var(--line);color:var(--text);width:34px;height:34px;border-radius:50%;font-size:15px;cursor:pointer;}
  .shMeta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--dim);word-break:break-all;line-height:1.5;}
  .shPrev{flex:1;min-height:120px;overflow:auto;display:flex;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;}
  .shPrev img{height:min(38vh,320px);width:auto;flex:0 0 auto;background:#fff;border-radius:4px;display:block;}
  .shActs{display:flex;flex-direction:column;gap:8px;}
  .shActs a.btn,.shActs button.btn{text-decoration:none;width:100%;}
  .shTip{font-size:12px;color:var(--dim);line-height:1.6;text-align:center;}

  #viewer{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;padding:20px;}
  #viewer.show{display:flex;}
  #viewer img{max-width:100%;max-height:100%;background:#fff;}

  #toast{position:fixed;left:50%;top:calc(var(--sat) + 70px);transform:translateX(-50%) translateY(-8px);background:rgba(33,37,45,.96);
    border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;
    transition:.2s;z-index:99;max-width:88vw;text-align:center;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  input[type=file]{display:none;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<!-- ============ LIBRARY (landing) ============ -->
<section id="screen-lib" class="screen active">
  <div class="libTop">
    <div class="brand">스캔<b>라인</b></div>
    <label class="sortWrap">
      <select id="sortSel" autocomplete="off" aria-label="정렬">
        <option value="time">시간순</option>
        <option value="name">이름순</option>
        <option value="size">크기순</option>
      </select>
    </label>
  </div>
  <div id="libScroll">
    <div id="installCard">
      <div class="icTop">
        <img src="icon-192.png" alt="">
        <div class="icTxt"><b>앱으로 설치하기</b><span id="icDesc">홈 화면에 추가하면 앱처럼 바로 열리고, 인터넷 없이도 써요.</span></div>
        <button id="icBtn">설치</button>
      </div>
      <div id="icSteps"></div>
    </div>
    <div id="libMeta"></div>
    <div id="libGrid"></div>
  </div>
  <div class="fabWrap">
    <button class="fabSm" id="importBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg>가져오기
    </button>
    <button class="fab" id="scanBtn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><line x1="4" y1="12" x2="20" y2="12"/></svg>스캔
    </button>
  </div>
</section>

<!-- ============ CAMERA ============ -->
<section id="screen-cam" class="screen">
  <div id="camStage">
    <video id="video" playsinline muted autoplay></video>
    <div id="flashFx"></div>
    <div class="camTop">
      <button class="chip" id="camClose">✕ 닫기</button>
      <div class="camTopGroup">
        <button class="chip" id="torchBtn" style="display:none">⚡ 플래시</button>
        <button class="chip accent" id="camDone" style="display:none">완료 · 저장</button>
      </div>
    </div>
    <div id="hint">문서 전체가 보이게 찍으세요 · 찍은 뒤 자동으로 크롭돼요</div>
    <div id="camFallback">
      <h2>실시간 카메라를 쓸 수 없어요</h2>
      <p id="fbMsg">카메라 권한이 거부됐거나 보안 연결(https)이 아니에요. 아래 버튼으로 카메라 앱에서 촬영해도 찍은 뒤 문서를 자동으로 찾아요.</p>
      <button class="btn primary" id="fbCapture">📷 카메라 앱으로 촬영</button>
      <button class="btn ghost" id="fbRetry">카메라 다시 시도</button>
    </div>
  </div>
  <div class="camBottom">
    <button class="sideBtn" id="galleryBtn" aria-label="갤러리에서 가져오기">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg>
    </button>
    <button class="shutter" id="shutterBtn" aria-label="촬영"><i></i></button>
    <button class="sideBtn ph" id="lastBtn" aria-label="촬영한 페이지">
      <img id="lastThumb" alt="">
      <span class="badge" id="camBadge">0</span>
    </button>
  </div>
</section>

<!-- ============ RESULT ============ -->
<section id="screen-res" class="screen">
  <div class="topbar">
    <button class="iconBtn" id="resBack">← 다시 찍기</button>
    <div class="title">스캔 결과</div>
    <span style="min-width:64px"></span>
  </div>
  <div id="resWrap">
    <canvas id="resCanvas"></canvas>
    <div id="busy"><div class="spin"></div><div id="busyMsg">문서를 찾는 중…</div></div>
  </div>
  <div class="toolsRow">
    <button class="tool" id="toolCrop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14"/></svg>크롭 조정</button>

<script>
/* =====================================================================
   Document detection (pure functions, no DOM)
   ===================================================================== */
//#DET-START
function boxBlur(src,w,h,r){
  const tmp=new Float32Array(w*h), out=new Uint8Array(w*h), k=2*r+1;
  for(let y=0;y<h;y++){
    const row=y*w; let sum=0;
    for(let x=-r;x<=r;x++) sum+=src[row+Math.min(w-1,Math.max(0,x))];
    for(let x=0;x<w;x++){
      tmp[row+x]=sum/k;
      sum+=src[row+Math.min(w-1,x+r+1)]-src[row+Math.max(0,x-r)];
    }
  }
  for(let x=0;x<w;x++){
    let sum=0;
    for(let y=-r;y<=r;y++) sum+=tmp[Math.min(h-1,Math.max(0,y))*w+x];
    for(let y=0;y<h;y++){
      out[y*w+x]=sum/k;
      sum+=tmp[Math.min(h-1,y+r+1)*w+x]-tmp[Math.max(0,y-r)*w+x];
    }
  }
  return out;
}
function maxFilter(src,w,h,r){
  const tmp=new Uint8Array(w*h), out=new Uint8Array(w*h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    let m=0; const a=Math.max(0,x-r), b=Math.min(w-1,x+r);
    for(let i=a;i<=b;i++){ const v=src[y*w+i]; if(v>m)m=v; }
    tmp[y*w+x]=m;
  }
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    let m=0; const a=Math.max(0,y-r), b=Math.min(h-1,y+r);
    for(let j=a;j<=b;j++){ const v=tmp[j*w+x]; if(v>m)m=v; }
    out[y*w+x]=m;
  }
  return out;
}
function otsu(gray){
  const hist=new Array(256).fill(0);
  for(let i=0;i<gray.length;i++) hist[gray[i]]++;
  const total=gray.length; let sum=0;
  for(let i=0;i<256;i++) sum+=i*hist[i];
  let sumB=0,wB=0,best=0,thr=128;
  for(let t=0;t<256;t++){
    wB+=hist[t]; if(!wB) continue;
    const wF=total-wB; if(!wF) break;
    sumB+=t*hist[t];
    const mB=sumB/wB, mF=(sum-sumB)/wF;
    const v=wB*wF*(mB-mF)*(mB-mF);
    if(v>best){best=v;thr=t;}
  }
  return thr;
}
function polyArea(p){
  let a=0;
  for(let i=0;i<p.length;i++){const q=p[(i+1)%p.length];a+=p[i][0]*q[1]-q[0]*p[i][1];}
  return Math.abs(a)/2;
}
function orderQuad(q){
  const cx=q.reduce((s,p)=>s+p[0],0)/4, cy=q.reduce((s,p)=>s+p[1],0)/4;
  const s=q.slice().sort((a,b)=>Math.atan2(a[1]-cy,a[0]-cx)-Math.atan2(b[1]-cy,b[0]-cx));
  let k=0,m=1e18;
  for(let i=0;i<4;i++){const v=s[i][0]+s[i][1]; if(v<m){m=v;k=i;}}
  return [s[k],s[(k+1)%4],s[(k+2)%4],s[(k+3)%4]];
}
function quadFromPoints(pts){
  let best=null,bestA=0;
  const n=pts.length/2;
  for(let deg=0;deg<90;deg+=10){
    const sel=[];
    for(let k=0;k<4;k++){
      const a=(deg+45+k*90)*Math.PI/180, dx=Math.cos(a), dy=Math.sin(a);
      let bi=0,bv=-1e18;
      for(let i=0;i<n;i++){const v=pts[2*i]*dx+pts[2*i+1]*dy; if(v>bv){bv=v;bi=i;}}
      sel.push([pts[2*bi],pts[2*bi+1]]);
    }
    const A=polyArea(sel);
    if(A>bestA){bestA=A;best=sel;}
  }
  if(!best) return null;
  return {q:orderQuad(best),area:bestA};
}
function quadOk(q,w,h){
  let sign=0;
  for(let i=0;i<4;i++){
    const a=q[i],b=q[(i+1)%4],c=q[(i+2)%4];
    const cr=(b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]);
    if(cr===0) return false;
    const s=cr>0?1:-1;
    if(sign&&s!==sign) return false;
    sign=s;
    const v1=[a[0]-b[0],a[1]-b[1]], v2=[c[0]-b[0],c[1]-b[1]];
    const cos=(v1[0]*v2[0]+v1[1]*v2[1])/(Math.hypot(...v1)*Math.hypot(...v2)+1e-9);
    const ang=Math.acos(Math.max(-1,Math.min(1,cos)))*180/Math.PI;
    if(ang<50||ang>130) return false;
    if(Math.hypot(b[0]-a[0],b[1]-a[1])<Math.min(w,h)*0.18) return false;
  }
  return true;
}
function findBestQuad(mask,w,h,weight){
  const N=w*h, lab=new Int32Array(N), stack=new Int32Array(N);
  let best=null,bestScore=0,id=0;
  for(let i=0;i<N;i++){
    if(!mask[i]||lab[i]) continue;
    id++; let sp=0; stack[sp++]=i; lab[i]=id;
    const pts=[]; let area=0;
    while(sp){
      const p=stack[--sp]; area++;
      const x=p%w, y=(p/w)|0; let edge=false;
      if(x>0){const q=p-1; if(mask[q]){if(!lab[q]){lab[q]=id;stack[sp++]=q;}} else edge=true;} else edge=true;
      if(x<w-1){const q=p+1; if(mask[q]){if(!lab[q]){lab[q]=id;stack[sp++]=q;}} else edge=true;} else edge=true;
      if(y>0){const q=p-w; if(mask[q]){if(!lab[q]){lab[q]=id;stack[sp++]=q;}} else edge=true;} else edge=true;
      if(y<h-1){const q=p+w; if(mask[q]){if(!lab[q]){lab[q]=id;stack[sp++]=q;}} else edge=true;} else edge=true;
      if(edge) pts.push(x,y);
    }
    if(area<N*0.08) continue;
    const r=quadFromPoints(pts);
    if(!r) continue;
    const qa=r.area/N;
    if(qa<0.1||qa>0.93) continue;
    const ratio=area/r.area;
    if(ratio<0.72||ratio>1.3) continue;
    if(!quadOk(r.q,w,h)) continue;
    const score=r.area*(1-Math.min(1,Math.abs(1-ratio)))*weight;
    if(score>bestScore){bestScore=score;best=r.q;}
  }
  return best?{q:best,score:bestScore}:null;
}
function detectFromGray(gray,w,h){
  const bl=boxBlur(gray,w,h,2);
  const t=otsu(bl), N=w*h;
  const bright=new Uint8Array(N), dark=new Uint8Array(N);
  for(let i=0;i<N;i++){ if(bl[i]>t) bright[i]=1; else dark[i]=1; }
  const a=findBestQuad(bright,w,h,1.0);
  const b=findBestQuad(dark,w,h,0.8);
  const pick=(a&&b)?(a.score>=b.score?a:b):(a||b);
  return pick?pick.q:null;
}
//#DET-END

/* =====================================================================
   App
   ===================================================================== */
const $=id=>document.getElementById(id);
const video=$('video');
const detCv=document.createElement('canvas'), detCtx=detCv.getContext('2d',{willReadFrequently:true});

const S={
  docs:[],            // library records (without nothing hidden; blobs live in each record)
  sort:'time',        // always starts as time order on every launch
  batch:[],           // [{canvas,thumb}] pages scanned in the current session
  appendTo:null,      // doc id when adding pages to an existing doc
  cur:null, queue:[], from:'cam',
  stream:null, camOn:false, torch:false,
  openDoc:null,
};

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2200);}
function show(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $('screen-'+name).classList.add('active');
  if(name==='cam') startCamera(); else stopCamera();
}
const nextFrame=()=>new Promise(r=>requestAnimationFrame(()=>setTimeout(r,16)));
const pad=n=>String(n).padStart(2,'0');
function fmtSize(b){ if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(0)+' KB'; return (b/1048576).toFixed(1)+' MB'; }
function fmtDate(t){ const d=new Date(t); return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function defaultName(t){ const d=new Date(t); return `스캔 ${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
const toBlob=(cv,type,q)=>new Promise(r=>cv.toBlob(r,type,q));
const blobToDataURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b);});
function blobToCanvas(b){
  return new Promise(res=>{
    const url=URL.createObjectURL(b), img=new Image();
    img.onload=()=>{const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
      c.getContext('2d').drawImage(img,0,0);URL.revokeObjectURL(url);res(c);};
    img.onerror=()=>{URL.revokeObjectURL(url);res(null);};
    img.src=url;
  });
}

/* ---------- storage (IndexedDB, in-memory fallback) ---------- */
const DB={ db:null, mem:new Map(), ok:true,
  open(){
    return new Promise(res=>{
      try{
        const r=indexedDB.open('scanline',1);
        r.onupgradeneeded=()=>r.result.createObjectStore('docs',{keyPath:'id'});
        r.onsuccess=()=>{DB.db=r.result;res();};
        r.onerror=()=>{DB.ok=false;res();};
        r.onblocked=()=>{DB.ok=false;res();};
      }catch(e){DB.ok=false;res();}
    });
  },
  tx(mode,fn){
    return new Promise(res=>{
      if(!DB.db){res(null);return;}
      try{
        const t=DB.db.transaction('docs',mode), st=t.objectStore('docs'), rq=fn(st);
        t.oncomplete=()=>res(rq?rq.result:true);
        t.onerror=t.onabort=()=>{DB.ok=false;res(null);};
      }catch(e){DB.ok=false;res(null);}
    });
  },
  async all(){ if(!DB.db) return Array.from(DB.mem.values()); return (await DB.tx('readonly',s=>s.getAll()))||[]; },
  async put(d){ DB.mem.set(d.id,d); if(DB.db) await DB.tx('readwrite',s=>s.put(d)); },
  async del(id){ DB.mem.delete(id); if(DB.db) await DB.tx('readwrite',s=>s.delete(id)); },
};

async function loadLib(){ S.docs=await DB.all(); renderLib(); }

/* ---------- library ---------- */
function sortedDocs(){
  const a=S.docs.slice();
  if(S.sort==='name') a.sort((x,y)=>x.name.localeCompare(y.name,'ko',{numeric:true,sensitivity:'base'}));
  else if(S.sort==='size') a.sort((x,y)=>y.size-x.size||y.createdAt-x.createdAt);
  else a.sort((x,y)=>y.createdAt-x.createdAt);
  return a;
}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderLib(){
  const g=$('libGrid'), meta=$('libMeta');
  if(!S.docs.length){
    meta.textContent='';
    g.style.display='block';
    g.innerHTML=`<div class="empty">
      <svg viewBox="0 0 64 64" fill="none"><rect x="14" y="8" width="36" height="48" rx="4" stroke="#8b92a3" stroke-width="2.5"/>
      <line x1="21" y1="20" x2="43" y2="20" stroke="#8b92a3" stroke-width="2.5"/><line x1="21" y1="28" x2="43" y2="28" stroke="#8b92a3" stroke-width="2.5"/>
      <line x1="21" y1="36" x2="34" y2="36" stroke="#8b92a3" stroke-width="2.5"/><rect x="8" y="40" width="48" height="4" rx="2" fill="#ffb92b"/></svg>
      <h2>아직 스캔한 문서가 없어요</h2>
      <p>아래 <b>스캔</b> 버튼을 눌러 문서를 찍어 보세요.<br>찍으면 종이 영역을 자동으로 찾아 크롭해요.</p></div>`;
    return;
  }
  g.style.display='';
  const label={time:'시간순 · 최신 먼저',name:'이름순 · 가나다',size:'크기순 · 큰 것 먼저'}[S.sort];
  meta.textContent=`${S.docs.length}개 문서 · ${label}`;
  g.innerHTML=sortedDocs().map(d=>`
    <div class="dcard" data-id="${d.id}">
      <div class="th"><img src="${d.thumb}" alt=""><span class="pg">${d.pages.length}p</span></div>
      <div class="info"><div class="nm">${esc(d.name)}</div>
      <div class="mt">${fmtDate(d.createdAt)}<br>${fmtSize(d.size)}</div></div>
    </div>`).join('');
  g.querySelectorAll('.dcard').forEach(c=>c.onclick=()=>openDocument(c.dataset.id));
}
$('sortSel').onchange=e=>{S.sort=e.target.value;renderLib();};
function resetSort(){ S.sort='time'; $('sortSel').value='time'; }

/* ---------- detection wrapper ---------- */
function detect(src,sw,sh){
  const s=240/Math.max(sw,sh);
  const w=Math.max(16,Math.round(sw*s)), h=Math.max(16,Math.round(sh*s));
  detCv.width=w; detCv.height=h;
  detCtx.drawImage(src,0,0,w,h);
  const d=detCtx.getImageData(0,0,w,h).data;
  const g=new Uint8Array(w*h);
  for(let i=0,j=0;i<g.length;i++,j+=4) g[i]=(d[j]*77+d[j+1]*150+d[j+2]*29)>>8;
  const q=detectFromGray(g,w,h);
  return q?q.map(p=>[p[0]/s,p[1]/s]):null;
}
function defaultCorners(w,h){
  const m=0.06;
  return [[w*m,h*m],[w*(1-m),h*m],[w*(1-m),h*(1-m)],[w*m,h*(1-m)]];
}

/* ---------- camera (plain preview; document is found after the shot) ---------- */
async function startCamera(){
  updateCamUI();
  if(S.camOn) return;
  $('camFallback').classList.remove('show');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    $('fbMsg').textContent='이 환경에서는 실시간 카메라를 사용할 수 없어요(https 연결 필요). 아래 버튼으로 카메라 앱에서 촬영해도 찍은 뒤 문서를 자동으로 찾아요.';
    $('camFallback').classList.add('show'); return;
  }
  try{
    S.stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:2560},height:{ideal:1440}},audio:false});
  }catch(e){
    $('fbMsg').textContent='카메라 권한이 거부됐거나 사용할 수 없어요. 브라우저 설정에서 카메라를 허용하거나, 아래 버튼으로 카메라 앱에서 촬영해 주세요.';
    $('camFallback').classList.add('show'); return;
  }
  if(!$('screen-cam').classList.contains('active')){ S.stream.getTracks().forEach(t=>t.stop()); S.stream=null; return; }
  video.srcObject=S.stream;
  try{await video.play();}catch(e){}
  S.camOn=true;
  const tr=S.stream.getVideoTracks()[0];
  try{
    const caps=tr.getCapabilities?tr.getCapabilities():{};
    $('torchBtn').style.display=caps.torch?'':'none';
    if(caps.focusMode&&caps.focusMode.includes('continuous')) tr.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{});
  }catch(e){}
  S.torch=false; $('torchBtn').classList.remove('on');
}
function stopCamera(){
  S.camOn=false;
  if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null;}
  video.srcObject=null;
}
function updateCamUI(){
  const n=S.batch.length;
  $('camDone').style.display=n?'':'none';
  $('lastBtn').classList.toggle('ph',!n);
  $('camBadge').textContent=n;
  if(n) $('lastThumb').src=S.batch[n-1].thumb;
}
async function shoot(){
  if(!S.camOn||!video.videoWidth) return;
  const w=video.videoWidth,h=video.videoHeight;
  const cv=document.createElement('canvas'); cv.width=w;cv.height=h;
  cv.getContext('2d').drawImage(video,0,0,w,h);
  $('flashFx').classList.remove('go'); void $('flashFx').offsetWidth; $('flashFx').classList.add('go');
  if(navigator.vibrate) navigator.vibrate(25);
  S.from='cam';
  await analyzeAndOpen(cv);
}
async function analyzeAndOpen(cv){
  // show the result screen first with a spinner, then find the document in the captured photo
  S.cur=null; $('busyMsg').textContent='문서를 찾는 중…';
  show('res'); setBusy(true);
  const rc=$('resCanvas'); rc.width=cv.width; rc.height=cv.height; rc.getContext('2d').drawImage(cv,0,0);
  await nextFrame();
  let c=detect(cv,cv.width,cv.height), found=!!c;
  if(!c) c=defaultCorners(cv.width,cv.height);
  if(!found) toast('문서를 찾지 못했어요. "크롭 조정"에서 직접 맞출 수 있어요');
  await openResult(cv,c);
}

/* ---------- loading from file ---------- */
function loadFile(file){
  return new Promise(res=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      const MAX=2800, sc=Math.min(1,MAX/Math.max(img.naturalWidth,img.naturalHeight));
      const w=Math.round(img.naturalWidth*sc), h=Math.round(img.naturalHeight*sc);
      const cv=document.createElement('canvas'); cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); res(cv);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);res(null);};
    img.src=url;
  });
}
async function nextFromQueue(){
  while(S.queue.length){
    const f=S.queue.shift();
    const cv=await loadFile(f);
    if(!cv){toast('이미지를 열 수 없어요');continue;}
    await analyzeAndOpen(cv); return true;
  }
  return false;
}
function pickFiles(e,from){
  const files=Array.from(e.target.files||[]); e.target.value='';
  if(!files.length) return;
  S.queue=files; S.from=from;
  nextFromQueue();
}
$('inCapture').onchange=e=>pickFiles(e,'cam');
$('inGallery').onchange=e=>pickFiles(e,S.galleryFrom||'lib');

/* ---------- perspective warp ---------- */
function solve8(A,b){
  const n=8;
  for(let i=0;i<n;i++){
    let p=i; for(let r=i+1;r<n;r++) if(Math.abs(A[r][i])>Math.abs(A[p][i])) p=r;
    [A[i],A[p]]=[A[p],A[i]]; [b[i],b[p]]=[b[p],b[i]];
    for(let r=0;r<n;r++){ if(r===i) continue; const f=A[r][i]/A[i][i];
      for(let c=i;c<n;c++) A[r][c]-=f*A[i][c]; b[r]-=f*b[i]; }
  }
  return b.map((v,i)=>v/A[i][i]);
}
function homography(dst,src){
  const A=[],b=[];
  for(let i=0;i<4;i++){
    const [x,y]=dst[i],[X,Y]=src[i];
    A.push([x,y,1,0,0,0,-x*X,-y*X]);b.push(X);
    A.push([0,0,0,x,y,1,-x*Y,-y*Y]);b.push(Y);
  }
  return solve8(A,b);
}
function warp(srcCv,q){
  const [tl,tr,br,bl]=q, d=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  let ow=Math.max(d(tl,tr),d(bl,br)), oh=Math.max(d(tl,bl),d(tr,br));
  const cap=2400, k=Math.min(1,cap/Math.max(ow,oh));
  ow=Math.max(200,Math.round(ow*k)); oh=Math.max(200,Math.round(oh*k));
  const sw=srcCv.width, sh=srcCv.height;
  const sd=srcCv.getContext('2d').getImageData(0,0,sw,sh).data;
  const out=document.createElement('canvas'); out.width=ow; out.height=oh;
  const octx2=out.getContext('2d'), od=octx2.createImageData(ow,oh), o=od.data;
  const H=homography([[0,0],[ow,0],[ow,oh],[0,oh]],[tl,tr,br,bl]);
  for(let y=0;y<oh;y++){
    for(let x=0;x<ow;x++){
      const den=H[6]*x+H[7]*y+1;
      let sx=(H[0]*x+H[1]*y+H[2])/den, sy=(H[3]*x+H[4]*y+H[5])/den;
      const oi=(y*ow+x)*4;
      sx=Math.min(sw-1.001,Math.max(0,sx)); sy=Math.min(sh-1.001,Math.max(0,sy));
      const x0=sx|0,y0=sy|0,fx=sx-x0,fy=sy-y0;
      const i00=(y0*sw+x0)*4,i10=i00+4,i01=i00+sw*4,i11=i01+4;
      const w00=(1-fx)*(1-fy),w10=fx*(1-fy),w01=(1-fx)*fy,w11=fx*fy;
      o[oi]=sd[i00]*w00+sd[i10]*w10+sd[i01]*w01+sd[i11]*w11;
      o[oi+1]=sd[i00+1]*w00+sd[i10+1]*w10+sd[i01+1]*w01+sd[i11+1]*w11;
      o[oi+2]=sd[i00+2]*w00+sd[i10+2]*w10+sd[i01+2]*w01+sd[i11+2]*w11;
      o[oi+3]=255;
    }
  }
  octx2.putImageData(od,0,0);
  return out;
}
function rotateCanvas(cv,deg){
  deg=((deg%360)+360)%360; if(!deg) return cv;
  const o=document.createElement('canvas');
  const sw=deg===180;
  o.width=sw?cv.width:cv.height; o.height=sw?cv.height:cv.width;
  const c=o.getContext('2d'); c.translate(o.width/2,o.height/2); c.rotate(deg*Math.PI/180);
  c.drawImage(cv,-cv.width/2,-cv.height/2); return o;
}

/* ---------- shadow removal + filters ---------- */
function normalize(cv){
  const w=cv.width,h=cv.height;
  const sw=Math.max(8,Math.round(w/12)), sh=Math.max(8,Math.round(h/12));
  const sm=document.createElement('canvas'); sm.width=sw;sm.height=sh;
  const sc=sm.getContext('2d',{willReadFrequently:true});
  sc.drawImage(cv,0,0,sw,sh);
  const d=sc.getImageData(0,0,sw,sh).data, lum=new Uint8Array(sw*sh);
  for(let i=0,j=0;i<lum.length;i++,j+=4) lum[i]=(d[j]*77+d[j+1]*150+d[j+2]*29)>>8;
  let bg=maxFilter(lum,sw,sh,3); bg=boxBlur(bg,sw,sh,3); bg=boxBlur(bg,sw,sh,3);
  const bc=document.createElement('canvas'); bc.width=sw;bc.height=sh;
  const bx=bc.getContext('2d'), bi=bx.createImageData(sw,sh);
  for(let i=0;i<bg.length;i++){bi.data[i*4]=bi.data[i*4+1]=bi.data[i*4+2]=bg[i];bi.data[i*4+3]=255;}
  bx.putImageData(bi,0,0);
  const big=document.createElement('canvas'); big.width=w;big.height=h;
  const bgx=big.getContext('2d',{willReadFrequently:true}); bgx.imageSmoothingQuality='high';
  bgx.drawImage(bc,0,0,w,h);
  const bd=bgx.getImageData(0,0,w,h).data;
  const out=document.createElement('canvas'); out.width=w;out.height=h;
  const ox=out.getContext('2d'), src=cv.getContext('2d').getImageData(0,0,w,h), s=src.data;
  for(let i=0;i<s.length;i+=4){
    const g=255/Math.max(60,bd[i]);
    s[i]=Math.min(255,s[i]*g); s[i+1]=Math.min(255,s[i+1]*g); s[i+2]=Math.min(255,s[i+2]*g);
  }
  ox.putImageData(src,0,0); return out;
}
const smooth=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
function applyFilter(base,norm,mode){
  if(mode==='original') return base;
  const w=norm.width,h=norm.height;
  const out=document.createElement('canvas'); out.width=w;out.height=h;
  const c=out.getContext('2d'), id=norm.getContext('2d').getImageData(0,0,w,h), d=id.data;
  for(let i=0;i<d.length;i+=4){
    const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255, l=0.299*r+0.587*g+0.114*b;
    if(mode==='magic'){
      const sat=1.25;
      d[i]=Math.pow(Math.min(1,Math.max(0,l+(r-l)*sat)),1.5)*255;
      d[i+1]=Math.pow(Math.min(1,Math.max(0,l+(g-l)*sat)),1.5)*255;
      d[i+2]=Math.pow(Math.min(1,Math.max(0,l+(b-l)*sat)),1.5)*255;
    }else if(mode==='bw'){
      const v=smooth(0.5,0.82,l)*255; d[i]=d[i+1]=d[i+2]=v;
    }else{
      const v=Math.pow(l,1.4)*255; d[i]=d[i+1]=d[i+2]=v;
    }
  }
  c.putImageData(id,0,0); return out;
}
const FILTERS=[['magic','매직 컬러'],['original','원본'],['bw','흑백 문서'],['gray','그레이']];

/* ---------- result screen ---------- */
function setBusy(v){$('busy').classList.toggle('show',v);}
async function openResult(srcCv,corners){
  S.cur={src:srcCv,corners,rot:0,filter:'magic',base0:null,base:null,norm:null,out:null};
  if(!$('screen-res').classList.contains('active')) show('res');
  $('busyMsg').textContent='문서를 보정하는 중…'; setBusy(true); await nextFrame();
  S.cur.base0=warp(srcCv,corners);
  await rebuild();
}
async function rebuild(){
  const c=S.cur; $('busyMsg').textContent='문서를 보정하는 중…'; setBusy(true); await nextFrame();
  c.base=rotateCanvas(c.base0,c.rot);
  c.norm=normalize(c.base);
  buildFilterThumbs(); renderResult(); setBusy(false);
}
function buildFilterThumbs(){
  const c=S.cur, row=$('filtersRow');
  const mw=96, mh=Math.max(1,Math.round(c.base.height*mw/c.base.width));
  const mini=document.createElement('canvas'); mini.width=mw;mini.height=mh;
  mini.getContext('2d').drawImage(c.base,0,0,mw,mh);
  const mnorm=normalize(mini);
  row.innerHTML='';
  FILTERS.forEach(([key,label])=>{
    const el=document.createElement('div'); el.className='fopt'+(key===c.filter?' active':''); el.dataset.k=key;
    const cv=document.createElement('canvas'); cv.width=mw;cv.height=60;
    const t=applyFilter(mini,mnorm,key);
    const cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,mw,60);
    cx.drawImage(t,0,0,t.width,Math.min(t.height,60),0,0,mw,60);
    const sp=document.createElement('span'); sp.textContent=label;
    el.append(cv,sp);
    el.onclick=async()=>{
      c.filter=key; row.querySelectorAll('.fopt').forEach(o=>o.classList.toggle('active',o===el));
      setBusy(true); await nextFrame(); renderResult(); setBusy(false);
    };
    row.appendChild(el);
  });
}
function renderResult(){
  const c=S.cur;
  c.out=applyFilter(c.base,c.norm,c.filter);
  const rc=$('resCanvas'); rc.width=c.out.width; rc.height=c.out.height;
  rc.getContext('2d').drawImage(c.out,0,0);
}
$('toolRotL').onclick=()=>{ if(S.cur){S.cur.rot-=90;rebuild();} };
$('toolRotR').onclick=()=>{ if(S.cur){S.cur.rot+=90;rebuild();} };
$('resBack').onclick=()=>{
  S.cur=null; S.queue=[];
  if(S.from==='cam') show('cam'); else leaveScanFlow();
};

function addCurToBatch(){
  const c=S.cur; if(!c||!c.out) return false;
  const t=document.createElement('canvas'), k=360/c.out.width;
  t.width=360; t.height=Math.max(1,Math.round(c.out.height*k));
  t.getContext('2d').drawImage(c.out,0,0,t.width,t.height);
  S.batch.push({canvas:c.out,thumb:t.toDataURL('image/jpeg',0.75)});
  S.cur=null; return true;
}
$('addNext').onclick=async()=>{
  if(!addCurToBatch()) return;
  toast(`${S.batch.length}장째 추가했어요`);
  if(S.queue.length) await nextFromQueue(); else show('cam');
};
$('finishBtn').onclick=async()=>{
  if(!addCurToBatch()) return;
  if(S.queue.length){ toast(`${S.batch.length}장째 추가했어요`); await nextFromQueue(); return; }
  await saveBatch();
};
$('camDone').onclick=()=>saveBatch();
$('lastBtn').onclick=()=>{ if(S.batch.length) saveBatch(); };

async function saveBatch(){
  if(!S.batch.length){ leaveScanFlow(); return; }
  show('res'); $('busyMsg').textContent='저장하는 중…'; setBusy(true); await nextFrame();
  const blobs=[]; let size=0;
  for(const p of S.batch){ const b=await toBlob(p.canvas,'image/jpeg',0.92); blobs.push(b); size+=b.size; }
  let doc, n=S.batch.length;
  const ap=S.appendTo&&S.docs.find(d=>d.id===S.appendTo);
  if(ap){
    ap.pages=ap.pages.concat(blobs); ap.size+=size; doc=ap;
  }else{
    const now=Date.now();
    doc={id:'d'+now.toString(36)+Math.random().toString(36).slice(2,6),name:defaultName(now),createdAt:now,
         pages:blobs,thumb:S.batch[0].thumb,size};
    S.docs.push(doc);
  }
  await DB.put(doc);
  if(!DB.db && !S.warnedMem){ S.warnedMem=true; setTimeout(()=>toast('이 브라우저에선 저장 공간을 쓸 수 없어 창을 닫으면 사라져요'),2400); }
  S.batch=[]; setBusy(false);
  const wasAppend=!!ap;
  S.appendTo=null; S.cur=null; S.queue=[];
  if(wasAppend){ S.openDoc=doc.id; renderDoc(); show('doc'); toast(`${n}장을 추가했어요`); }
  else { resetSort(); renderLib(); show('lib'); toast('스캔을 저장했어요'); }
}
function leaveScanFlow(){
  S.batch=[]; S.cur=null; S.queue=[];
  if(S.appendTo){ const id=S.appendTo; S.appendTo=null; S.openDoc=id; renderDoc(); show('doc'); }
  else { renderLib(); show('lib'); }
}

/* ---------- crop adjust ---------- */
let cropCorners=null;
function openCrop(){
  const c=S.cur; if(!c) return;
  cropCorners=c.corners.map(p=>p.slice());
  const cv=$('cropCanvas'); cv.width=c.src.width; cv.height=c.src.height;
  cv.getContext('2d').drawImage(c.src,0,0);
  show('crop'); drawCrop();
}
function drawCrop(){
  const c=S.cur, svg=$('cropSvg'), W=c.src.width, H=c.src.height;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('preserveAspectRatio','none');
  const r=Math.max(W,H)*0.012, hit=Math.max(W,H)*0.05;
  svg.innerHTML=`<polygon class="quadFill" points="${cropCorners.map(p=>p.join(',')).join(' ')}"/>`+
    cropCorners.map((p,i)=>`<circle class="hv" cx="${p[0]}" cy="${p[1]}" r="${r}"/><circle class="hit" data-i="${i}" cx="${p[0]}" cy="${p[1]}" r="${hit}"/>`).join('');
  svg.querySelectorAll('.hit').forEach(h=>h.addEventListener('pointerdown',e=>{
    e.preventDefault(); const i=+h.dataset.i; h.setPointerCapture(e.pointerId);
    const mv=ev=>{
      const rc=svg.getBoundingClientRect();
      const x=(ev.clientX-rc.left)/rc.width*W, y=(ev.clientY-rc.top)/rc.height*H;
      cropCorners[i]=[Math.max(0,Math.min(W,x)),Math.max(0,Math.min(H,y))];
      svg.querySelector('polygon').setAttribute('points',cropCorners.map(p=>p.join(',')).join(' '));
      const hv=svg.querySelectorAll('.hv'); hv[i].setAttribute('cx',cropCorners[i][0]); hv[i].setAttribute('cy',cropCorners[i][1]);
      h.setAttribute('cx',cropCorners[i][0]); h.setAttribute('cy',cropCorners[i][1]);
    };
    const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);};
    h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
  }));
}
$('toolCrop').onclick=openCrop;
$('cropAuto').onclick=()=>{
  const c=S.cur, q=detect(c.src,c.src.width,c.src.height);
  if(q){cropCorners=q;drawCrop();} else toast('문서를 찾지 못했어요');
};
$('cropFull').onclick=()=>{const c=S.cur;cropCorners=[[0,0],[c.src.width,0],[c.src.width,c.src.height],[0,c.src.height]];drawCrop();};
$('cropCancel').onclick=()=>show('res');
$('cropOk').onclick=async()=>{
  const c=S.cur; c.corners=cropCorners.map(p=>p.slice());
  show('res'); setBusy(true); await nextFrame();
  c.base0=warp(c.src,c.corners); await rebuild();
};

/* ---------- document detail ---------- */
let pageUrls=[];
function curDoc(){ return S.docs.find(d=>d.id===S.openDoc); }
function openDocument(id){ S.openDoc=id; renderDoc(); show('doc'); }
function renderDoc(){
  const d=curDoc(); if(!d){ renderLib(); show('lib'); return; }
  pageUrls.forEach(u=>URL.revokeObjectURL(u));
  pageUrls=d.pages.map(b=>URL.createObjectURL(b));
  $('docName').value=d.name;
  $('docMeta').textContent=`${fmtDate(d.createdAt)} · ${d.pages.length}장 · ${fmtSize(d.size)}`;
  const g=$('pagesGrid');
  g.innerHTML=d.pages.map((_,i)=>`
    <div class="pcard"><span class="n">${i+1}</span><button class="x" data-a="del" data-i="${i}" aria-label="페이지 삭제">×</button>
    <img src="${pageUrls[i]}" data-i="${i}" alt="${i+1}페이지"><div class="mv"><button data-a="l" data-i="${i}">◀</button><button data-a="r" data-i="${i}">▶</button></div></div>`).join('');
  g.querySelectorAll('img').forEach(im=>im.onclick=()=>{ $('viewerImg').src=im.src; $('viewer').classList.add('show'); });
  g.querySelectorAll('button').forEach(b=>b.onclick=async()=>{
    const i=+b.dataset.i,a=b.dataset.a;
    if(a==='del'){
      if(d.pages.length===1){ if(confirm('마지막 페이지예요. 문서를 삭제할까요?')) await deleteDoc(d); return; }
      d.size-=d.pages[i].size; d.pages.splice(i,1);
      if(i===0) d.thumb=await makeThumb(d.pages[0]);
    }else{
      const j=a==='l'?i-1:i+1; if(j<0||j>=d.pages.length) return;
      [d.pages[i],d.pages[j]]=[d.pages[j],d.pages[i]];
      if(i===0||j===0) d.thumb=await makeThumb(d.pages[0]);
    }
    await DB.put(d); renderDoc();
  });
}
async function makeThumb(blob){
  const c=await blobToCanvas(blob), t=document.createElement('canvas'), k=360/c.width;
  t.width=360; t.height=Math.max(1,Math.round(c.height*k)); t.getContext('2d').drawImage(c,0,0,t.width,t.height);
  return t.toDataURL('image/jpeg',0.75);
}
$('viewer').onclick=()=>$('viewer').classList.remove('show');
$('docBack').onclick=()=>{ renderLib(); show('lib'); };
$('docName').onchange=async e=>{
  const d=curDoc(); if(!d) return;
  d.name=e.target.value.trim()||defaultName(d.createdAt); e.target.value=d.name;
  await DB.put(d); toast('이름을 바꿨어요');
};
$('docName').onkeydown=e=>{ if(e.key==='Enter') e.target.blur(); };
async function deleteDoc(d){
  await DB.del(d.id); S.docs=S.docs.filter(x=>x.id!==d.id);
  S.openDoc=null; renderLib(); show('lib'); toast('문서를 삭제했어요');
}
$('docDelete').onclick=async()=>{ const d=curDoc(); if(d&&confirm(`"${d.name}"을(를) 삭제할까요?`)) await deleteDoc(d); };
$('docAddPage').onclick=()=>{ S.appendTo=S.openDoc; S.batch=[]; show('cam'); };

/* ---------- export (per document) ---------- */
function safeName(n){ return n.replace(/[\\/:*?"<>|]+/g,'_').trim()||'scan'; }
let shUrl=null, shFile=null;
function closeSheet(){
  $('exportSheet').classList.remove('show');
  if(shUrl){ const u=shUrl; shUrl=null; setTimeout(()=>URL.revokeObjectURL(u),3000); }
  shFile=null;
}
function openSheet(blob,name,kind){
  const d=curDoc();
  if(shUrl) URL.revokeObjectURL(shUrl);
  shUrl=URL.createObjectURL(blob); shFile=new File([blob],name,{type:blob.type});
  const label={pdf:'PDF',jpg:'JPG',png:'PNG',zip:'ZIP'}[kind];
  $('shTitle').textContent=label+' 파일이 준비됐어요';
  $('shMeta').textContent=`${name} · ${fmtSize(blob.size)}`;
  $('shPrev').innerHTML=pageUrls.map((u,i)=>`<img src="${u}" alt="${i+1}페이지">`).join('');
  const save=$('shSave'); save.href=shUrl; save.setAttribute('download',name);
  const open=$('shOpen');
  if(kind==='zip'){ open.style.display='none'; } else { open.style.display=''; open.href=shUrl; }
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[shFile]}));
  $('shShare').style.display=canShare?'':'none';
  $('shTip').textContent=(kind==='jpg'||kind==='png')
    ?'"저장하기"가 안 되면 "공유"로 사진 앱에 저장하거나, 새 탭에서 이미지를 길게 눌러 저장하세요.'
    :(kind==='zip'?'"저장하기"가 안 되면 "공유"에서 파일 앱을 선택하세요.':'"저장하기"가 안 되면 "새 탭에서 열기" 후 공유 버튼으로 저장하세요.');
  $('exportSheet').classList.add('show');
}
$('shClose').onclick=closeSheet;
$('exportSheet').onclick=e=>{ if(e.target.id==='exportSheet') closeSheet(); };
$('shSave').onclick=()=>{ setTimeout(()=>toast('다운로드를 시작했어요'),50); };
$('shShare').onclick=async()=>{
  if(!shFile) return;
  try{ await navigator.share({files:[shFile],title:shFile.name}); }catch(e){ if(e&&e.name!=='AbortError') toast('공유할 수 없어요. "저장하기"를 눌러 보세요'); }
};
$('expPdf').onclick=async()=>{
  const d=curDoc(); if(!d) return;
  const {jsPDF}=window.jspdf||{}; if(!jsPDF) return toast('PDF 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요');
  toast('PDF를 만드는 중…');
  let pdf;
  for(let i=0;i<d.pages.length;i++){
    const cv=await blobToCanvas(d.pages[i]); if(!cv) continue;
    const w=cv.width,h=cv.height, land=w>h;
    const W=land?297:297*w/h, H=land?297*h/w:297, o=land?'l':'p';
    if(!pdf) pdf=new jsPDF({orientation:o,unit:'mm',format:[W,H]}); else pdf.addPage([W,H],o);
    pdf.addImage(await blobToDataURL(d.pages[i]),'JPEG',0,0,W,H);
  }
  if(!pdf) return toast('내보낼 페이지가 없어요');
  openSheet(pdf.output('blob'),safeName(d.name)+'.pdf','pdf');
};
async function expImg(ext,type){
  const d=curDoc(); if(!d) return;
  const base=safeName(d.name);
  const conv=async b=>{
    if(type==='image/jpeg') return b;
    const cv=await blobToCanvas(b); return toBlob(cv,type);
  };
  toast(ext.toUpperCase()+'를 만드는 중…');
  if(d.pages.length===1){
    return openSheet(await conv(d.pages[0]),`${base}.${ext}`,ext);
  }
  if(!window.JSZip) return toast('ZIP 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요');
  const zip=new JSZip();
  for(let i=0;i<d.pages.length;i++) zip.file(`${base}_${pad(i+1)}.${ext}`,await conv(d.pages[i]));
  openSheet(await zip.generateAsync({type:'blob'}),`${base}_${ext}.zip`,'zip');
}
$('expJpg').onclick=()=>expImg('jpg','image/jpeg');
$('expPng').onclick=()=>expImg('png','image/png');

/* ---------- wiring ---------- */
$('scanBtn').onclick=()=>{ S.appendTo=null; S.batch=[]; show('cam'); };
$('importBtn').onclick=()=>{ S.appendTo=null; S.batch=[]; S.galleryFrom='lib'; $('inGallery').click(); };
$('galleryBtn').onclick=()=>{ S.galleryFrom='cam'; $('inGallery').click(); };
$('shutterBtn').onclick=shoot;
$('fbCapture').onclick=()=>$('inCapture').click();
$('fbRetry').onclick=()=>{S.camOn=false;startCamera();};
$('camClose').onclick=()=>{
  if(S.batch.length&&!confirm(`스캔한 ${S.batch.length}장을 저장하지 않고 나갈까요?`)) return;
  leaveScanFlow();
};
$('torchBtn').onclick=async()=>{
  if(!S.stream) return;
  S.torch=!S.torch;
  try{await S.stream.getVideoTracks()[0].applyConstraints({advanced:[{torch:S.torch}]});}catch(e){S.torch=false;}
  $('torchBtn').classList.toggle('on',S.torch);
};
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&S.camOn) stopCamera();
  else if(!document.hidden&&$('screen-cam').classList.contains('active')) startCamera();
});
window.addEventListener('pageshow',e=>{ if(e.persisted){ resetSort(); renderLib(); } });


/* ---------- install as app (PWA) ---------- */
const isStandalone=()=>(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let deferredInstall=null;
function renderInstall(){
  const card=$('installCard');
  if(isStandalone()){ card.classList.remove('show'); return; }
  card.classList.add('show');
  const btn=$('icBtn'), steps=$('icSteps');
  if(deferredInstall){ btn.textContent='설치'; steps.classList.remove('show'); }
  else{
    btn.textContent='설치 방법';
    steps.innerHTML=isIOS
      ?'1. Safari 아래쪽 <b>공유 버튼(□↑)</b>을 눌러요<br>2. <b>홈 화면에 추가</b>를 골라요<br>3. 오른쪽 위 <b>추가</b>를 누르면 끝!'
      :'1. 브라우저 오른쪽 위 <b>메뉴(⋮)</b>를 눌러요<br>2. <b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 골라요<br>3. <b>설치</b>를 누르면 끝!';
  }
}
$('icBtn').onclick=async()=>{
  if(deferredInstall){
    deferredInstall.prompt();
    const r=await deferredInstall.userChoice.catch(()=>null);
    deferredInstall=null; renderInstall();
    if(r&&r.outcome==='accepted') toast('설치 중이에요');
  }else{
    $('icSteps').classList.toggle('show');
  }
};
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredInstall=e; renderInstall(); });
window.addEventListener('appinstalled',()=>{ deferredInstall=null; renderInstall(); toast('앱이 설치됐어요. 홈 화면에서 열어 보세요'); });
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
renderInstall();

/* ---------- init: always open on the library, sorted by time ---------- */
(async()=>{
  resetSort();
  await DB.open();
  await loadLib();
})();
</script>
</body>
</html>
